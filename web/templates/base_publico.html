<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <script>
        if (localStorage.getItem('tema') === 'oscuro') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <title>{% block title %}CRM Agencia{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="layout-publico">
        <span class="forma-decorativa forma-decorativa-1" aria-hidden="true"></span>
        <span class="forma-decorativa forma-decorativa-2" aria-hidden="true"></span>
        <div class="tarjeta-publica">
            <div class="panel-formulario">
                <div class="contenido-publico">
                    {% with mensajes = get_flashed_messages(with_categories=true) %}
                        {% if mensajes %}
                            <div class="flash-contenedor">
                                {% for categoria, mensaje in mensajes %}
                                    <div class="flash flash-{{ categoria }}">{{ mensaje }}</div>
                                {% endfor %}
                            </div>
                        {% endif %}
                    {% endwith %}
                    {% block content %}{% endblock %}
                </div>
            </div>
            <div class="panel-marca" aria-hidden="true">
                <span class="panel-marca-forma panel-marca-forma-1"></span>
                <span class="panel-marca-forma panel-marca-forma-2"></span>
                <div class="marca-contenido">
                    <span class="marca-logo-grande">C</span>
                    <h2 class="marca-titulo">CRM Agencia</h2>
                    <p class="marca-tagline">Gestioná clientes, proyectos, pagos y notas en un solo lugar.</p>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
