{% from "_iconos.html" import icono %}
<dialog id="modal-factura" class="modal modal-ancho">
    <form method="POST" id="formulario-factura" class="formulario">
        <div class="modal-encabezado">
            <div class="modal-encabezado-info">
                <span class="icono-chip icono-chip-pagos">{{ icono('facturas', tamano=19) }}</span>
                <div>
                    <h2 id="modal-factura-titulo">Nueva factura</h2>
                </div>
            </div>
            <button type="button" id="boton-cerrar-modal-factura" class="btn-cerrar-modal" aria-label="Cerrar">
                {{ icono('cerrar', tamano=18) }}
            </button>
        </div>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div id="modal-factura-error" class="flash flash-error" role="alert" hidden></div>
        <div class="modal-campos-grid">
            <div class="campo campo-ancho">
                <label for="proyecto_id-factura">Proyecto</label>
                <select id="proyecto_id-factura" name="proyecto_id">
                    {% for p in proyectos %}
                    <option value="{{ p[0] }}">{{ p[1] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="campo">
                <label for="fecha_emision-factura">Fecha de emisión (opcional)</label>
                <input type="date" id="fecha_emision-factura" name="fecha_emision">
            </div>
            <div class="campo">
                <label for="fecha_vencimiento-factura">Vencimiento (opcional)</label>
                <input type="date" id="fecha_vencimiento-factura" name="fecha_vencimiento">
            </div>
        </div>

        <h3 class="cotizacion-seccion-titulo">Ítems</h3>
        <div id="filas-items-factura" class="cotizacion-items">
            <div class="cotizacion-item-encabezado">
                <span>Descripción</span>
                <span>Cantidad</span>
                <span>Precio unitario</span>
                <span>Importe</span>
                <span></span>
            </div>
        </div>
        <button type="button" id="boton-agregar-item-factura" class="btn btn-secundario btn-sm">{{ icono('mas', tamano=14) }} Agregar ítem</button>

        <div class="cotizacion-totales">
            <div class="campo">
                <label for="descuento-factura">Descuento (opcional, monto fijo)</label>
                <input type="number" step="0.01" min="0" id="descuento-factura" name="descuento" value="0">
            </div>
            <div class="campo">
                <label for="impuesto_porcentaje-factura">Impuesto (opcional, %)</label>
                <input type="number" step="0.01" min="0" id="impuesto_porcentaje-factura" name="impuesto_porcentaje" value="0">
            </div>
            <div class="cotizacion-resumen">
                <div><span>Subtotal</span><span id="resumen-subtotal-factura">$0.00</span></div>
                <div><span>Total</span><span id="resumen-total-factura" class="cotizacion-resumen-total">$0.00</span></div>
            </div>
        </div>

        <div class="campo campo-ancho">
            <label for="notas-factura">Notas (opcional)</label>
            <textarea id="notas-factura" name="notas" rows="3"></textarea>
        </div>

        <div class="acciones-formulario">
            <button type="button" id="boton-cancelar-modal-factura" class="btn btn-secundario">Cancelar</button>
            <input type="submit" value="Guardar" data-cargando="Guardando...">
        </div>
    </form>
</dialog>

<template id="plantilla-item-factura">
    <div class="cotizacion-item-fila">
        <input type="text" name="item_descripcion[]" placeholder="Descripción del ítem">
        <input type="number" step="0.01" min="0" name="item_cantidad[]" class="cotizacion-item-cantidad" value="1">
        <input type="number" step="0.01" min="0" name="item_precio[]" class="cotizacion-item-precio" value="0">
        <span class="cotizacion-item-importe">$0.00</span>
        <button type="button" class="btn btn-secundario btn-sm btn-icono boton-quitar-item" aria-label="Quitar ítem">{{ icono('eliminar', tamano=14) }}</button>
    </div>
</template>
