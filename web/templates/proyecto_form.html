{% extends "base.html" %}

{% block title %}{% if proyecto %}Editar proyecto{% else %}Nuevo proyecto{% endif %} · CRM Agencia{% endblock %}

{% block content %}
    {% if proyecto %}
        <h1>Editar proyecto</h1>
    {% else %}
        <h1>Nuevo proyecto</h1>
    {% endif %}

    <form method="POST" class="formulario">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="campo">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" value="{{ proyecto[1] if proyecto else '' }}">
        </div>
        <div class="campo">
            <label for="cliente_id">Cliente</label>
            <select id="cliente_id" name="cliente_id">
                {% for cliente in clientes %}
                    <option value="{{ cliente[0] }}" {% if proyecto and cliente[0] == proyecto[2] %}selected{% endif %}>{{ cliente[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="campo">
            <label for="estado">Estado</label>
            <select id="estado" name="estado">
                <option value="Pendiente" {% if proyecto and proyecto[3] == "Pendiente" %}selected{% endif %}>Pendiente</option>
                <option value="En progreso" {% if proyecto and proyecto[3] == "En progreso" %}selected{% endif %}>En progreso</option>
                <option value="Completado" {% if proyecto and proyecto[3] == "Completado" %}selected{% endif %}>Completado</option>
            </select>
        </div>
        <div class="campo">
            <label for="fecha_entrega">Fecha de entrega</label>
            <input type="date" id="fecha_entrega" name="fecha_entrega" value="{{ proyecto[4] if proyecto else '' }}">
        </div>

        {% if proyecto %}
            <input type="submit" value="Guardar cambios">
        {% else %}
            <input type="submit" value="Guardar">
        {% endif %}
    </form>
{% endblock %}
