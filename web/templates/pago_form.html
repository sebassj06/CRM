{% extends "base.html" %}

{% block title %}{% if pago %}Editar pago{% else %}Nuevo pago{% endif %} · CRM Agencia{% endblock %}

{% block content %}
    {% if pago %}
        <h1>Editar pago</h1>
    {% else %}
        <h1>Nuevo pago</h1>
    {% endif %}

    <form method="POST" class="formulario">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="campo">
            <label for="proyecto_id">Proyecto</label>
            <select id="proyecto_id" name="proyecto_id">
                {% for proyecto in proyectos %}
                    <option value="{{ proyecto[0] }}" {% if pago and proyecto[0] == pago[1] %}selected{% endif %}>{{ proyecto[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="campo">
            <label for="monto">Monto</label>
            <input type="number" step="0.01" min="0" id="monto" name="monto" value="{{ pago[2] if pago else '' }}">
        </div>
        <div class="campo">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" value="{{ pago[3] if pago else '' }}">
        </div>

        {% if pago %}
            <input type="submit" value="Guardar cambios">
        {% else %}
            <input type="submit" value="Guardar">
        {% endif %}
    </form>
{% endblock %}
